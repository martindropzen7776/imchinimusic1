<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM CHINI MUSIC</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">

    <!-- Meta Pixel Code -->

    <noscript>
        <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=7220249721355274&ev=PageView&noscript=1"/>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: #ffd400;
        }

        .landing {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 100vh;

            background-image: url('background1.png');
            background-size: contain;
            background-position: center top;
            background-repeat: no-repeat;
            background-color: #ffd400;

            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: transparent;
            pointer-events: none;
        }

        .button {
            position: relative;
            z-index: 2;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 290px;
            padding: 16px 28px;
            border-radius: 999px;

            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;

            color: #000000;
            background: #ffffff;
            border: 2px solid #ffffff;

            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
            transition: box-shadow 0.25s ease, filter 0.25s ease;

            animation: zoomPulse 1.8s infinite;
            transform: translateY(230px);
        }

        .button:hover {
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
            filter: brightness(0.96);
        }

        .button:active {
            transform: translateY(230px) scale(0.98);
        }

        @keyframes zoomPulse {
            0% {
                transform: translateY(230px) scale(1);
            }

            50% {
                transform: translateY(230px) scale(1.04);
            }

            100% {
                transform: translateY(230px) scale(1);
            }
        }

        @media screen and (max-width: 768px) {
            .landing {
                height: 100dvh;
                background-size: contain;
                background-position: center top;
                background-repeat: no-repeat;
                background-color: #ffd400;
            }

            .button {
                min-width: 250px;
                width: 100%;
                max-width: 320px;
                font-size: 16px;
                padding: 15px 22px;
                transform: translateY(210px);
            }

            .button:active {
                transform: translateY(210px) scale(0.98);
            }

            @keyframes zoomPulse {
                0% {
                    transform: translateY(210px) scale(1);
                }

                50% {
                    transform: translateY(210px) scale(1.04);
                }

                100% {
                    transform: translateY(210px) scale(1);
                }
            }
        }

        @media screen and (max-width: 420px) {
            .button {
                max-width: 300px;
                font-size: 15px;
                transform: translateY(200px);
            }

            .button:active {
                transform: translateY(200px) scale(0.98);
            }

            @keyframes zoomPulse {
                0% {
                    transform: translateY(200px) scale(1);
                }

                50% {
                    transform: translateY(200px) scale(1.04);
                }

                100% {
                    transform: translateY(200px) scale(1);
                }
            }
        }
    </style>
</head>

<body>
    <div class="landing">
        <div class="overlay"></div>

        <a 
            href="https://wearebombo.app.link/ffKJwSHqn4b" 
            class="button" 
            target="_blank" 
            rel="noopener noreferrer"
            onclick="trackPurchase(event, this.href);"
        >
            COMPRA TU TICKET
        </a>
    </div>

    <script>
    function trackPurchase(event, url) {
        event.preventDefault();

        if (typeof fbq === 'function') {
            fbq('track', 'Purchase', {
                content_name: 'From The End Of The World',
                content_type: 'music',
                content_ids: ['5fi8kozBjhekkFirkWAsoJ']
            });
        }

        setTimeout(function() {
            window.open(url, '_blank', 'noopener,noreferrer');
        }, 300);
    }
    </script>
</body>
</html>
